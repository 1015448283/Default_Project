name: Desplegar en GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Proyecto"
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "Proyecto/package-lock.json"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicación
        run: |
          npm run build
          cp dist/index.html dist/404.html
        env:
          BASE_PATH: /Default_Project/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://vgmugvsxkcfjdcxxhpsj.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnbXVndnN4a2NmamRjeHhocHNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4MTkwNjMsImV4cCI6MjEwNjM5NTA2M30.6onIEeHJ6AobvI2V5HxhWK9hSYwoqWQvdl7MP2-ann8' }}

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Proyecto/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
